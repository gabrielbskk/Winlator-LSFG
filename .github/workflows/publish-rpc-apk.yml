name: Publish experimental RPC APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag
        required: true
        type: string
      staging_ref:
        description: Branch containing release.zip.001 and release.zip.002
        required: true
        type: string
      apk_name:
        description: Name of the complete APK inside the ZIP
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified APK parts
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.staging_ref }}
          persist-credentials: false
      - name: Reassemble and verify APK
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          set -euo pipefail
          sha256sum -c PARTS-SHA256SUMS.txt
          cat release.zip.001 release.zip.002 > release.zip
          unzip -t release.zip
          unzip -j release.zip "$APK_NAME" -d .
          sha256sum -c SHA256SUMS.txt
      - name: Check packaged Windows 32-bit components
        env:
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          set -euo pipefail
          python3 -m venv .venv
          .venv/bin/pip install 'zstandard>=0.23,<1'
          .venv/bin/python - <<'PY'
          import os
          import sys
          import tarfile
          import zipfile
          import zstandard

          checks = {
              "assets/rootfs.tzst": "/i386-windows/",
              "assets/wincomponents/direct3d.tzst": "/syswow64/",
          }
          apk = os.environ["APK_NAME"]
          try:
              with zipfile.ZipFile(apk) as package:
                  for asset, required in checks.items():
                      if asset not in package.namelist():
                          raise RuntimeError("Missing required asset: " + asset)
                      with package.open(asset) as stream:
                          with zstandard.ZstdDecompressor().stream_reader(stream) as decoded:
                              with tarfile.open(fileobj=decoded, mode="r|") as archive:
                                  present = any(
                                      required.strip("/") in ("/" + item.name.strip("/") + "/")
                                      for item in archive if item.isfile()
                                  )
                      if not present:
                          raise RuntimeError("Windows 32-bit assets missing from " + asset)
                      print("Verified Windows 32-bit components:", asset)
          except Exception as exc:
              print("Full Windows compatibility package validation failed:", exc, file=sys.stderr)
              sys.exit(1)
          PY
      - name: Upload complete APK to experimental release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          APK_NAME: ${{ inputs.apk_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "$APK_NAME" \
            SHA256SUMS.txt --repo gabrielbskk/Winlator-LSFG --clobber
