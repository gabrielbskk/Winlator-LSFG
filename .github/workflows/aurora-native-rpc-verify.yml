name: Aurora native RPC verification (no release)

on:
  push:
    branches: [feat/aurora-consolidation]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/aurora-native-rpc-verify.yml'
  pull_request:
    branches: [experimental/rpc-android-v4]
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/aurora-native-rpc-verify.yml'

permissions:
  contents: read

concurrency:
  group: aurora-native-verify-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-native-rpc:
    # Use the maintainer's existing pinned SDK source only for same-repository
    # consolidation work; never load it into an untrusted fork PR.
    if: ${{ github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/aurora-consolidation') }}
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check Aurora UI resources and driver inventory
        run: |
          python3 scripts/test_aurora_resources.py
          python3 scripts/test_driver_inventory.py
          python3 scripts/audit_graphics_drivers.py > /tmp/aurora-driver-inventory.json
          python3 -m json.tool /tmp/aurora-driver-inventory.json > /dev/null

      - name: Android SDK and ARM64 NDK (no publication)
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi

      - name: Load and verify maintainer-pinned Discord SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_discord_sdk_mediafire.py \
            --quickkey 'ryfql41ytwr2rrs' \
            --sha256 'b1b2491f1e1848c79fd6f1986d5aa1e0c8019e88a6e62c7be06b89e8e4870933' \
            --out "$RUNNER_TEMP/discord_partner_sdk.aar"
          python3 scripts/check_discord_aar.py "$RUNNER_TEMP/discord_partner_sdk.aar"

      - name: Run JVM regression tests and build full native RPC
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -PdiscordSdkAar="$RUNNER_TEMP/discord_partner_sdk.aar" \
            -PandroidNdkVersion=27.2.12479018 \
            --no-daemon --stacktrace

      - name: Verify Android APK, JNI libraries and Windows x86/x64 assets
        shell: bash
        run: |
          set -euo pipefail
          APK="app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          python3 scripts/verify_rpc_v4_apk.py "$APK"
          unzip -tq "$APK" >/dev/null
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libwinlator_discord.so'
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libdiscord_partner_sdk.so'
          test -n "$(sha256sum "$APK")"

# No artifacts or releases are published. The proprietary AAR is temporary and
# must not be committed or redistributed. Passing this gate does not prove
# real-device RPC, GPU stability or Windows games/LSFG compatibility.
