name: RPC Experimental 5 — private SDK native build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk-backed-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK, NDK and zstd
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq zstd
          fi
      - name: Load licensed SDK from owner-configured private download
        shell: bash
        env:
          SDK_URL: ${{ secrets.DISCORD_SDK_AAR_URL }}
          SDK_SHA256: ${{ secrets.DISCORD_SDK_AAR_SHA256 }}
        run: |
          set -euo pipefail
          if [ -z "$SDK_URL" ] || [ -z "$SDK_SHA256" ]; then
            echo "Set DISCORD_SDK_AAR_URL and DISCORD_SDK_AAR_SHA256 in repository Actions secrets." >&2
            exit 1
          fi
          mkdir -p app/app/libs
          SDK_PATH="$PWD/app/app/libs/discord_partner_sdk.aar"
          curl --fail --silent --show-error --location --max-time 240 \
            --output "$SDK_PATH" "$SDK_URL"
          test "$(wc -c < "$SDK_PATH")" -gt 1000000
          test "$(wc -c < "$SDK_PATH")" -lt 100000000
          printf '%s  %s\n' "$SDK_SHA256" "$SDK_PATH" | sha256sum --check --status
          python3 scripts/check_discord_aar.py "$SDK_PATH"
      - name: Build and test SDK-enabled Android ARM64 APK
        shell: bash
        working-directory: app
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug \
            -PdiscordSdkAar="$GITHUB_WORKSPACE/app/app/libs/discord_partner_sdk.aar" \
            -PandroidNdkVersion=27.2.12479018 \
            --no-daemon --stacktrace
      - name: Verify full guest assets and native Discord bridge
        shell: bash
        run: |
          set -euo pipefail
          APK="app/app/build/outputs/apk/debug/app-debug.apk"
          python3 scripts/verify_rpc_v4_apk.py "$APK"
          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libdiscord_partner_sdk.so'
          mkdir -p dist/rpc-v5-native-candidate
          cp "$APK" dist/rpc-v5-native-candidate/Winlator-LSFG-Aurora-11.2-rpc-experimental.5-arm64-debug.apk
          (cd dist/rpc-v5-native-candidate && sha256sum *.apk > SHA256SUMS.txt)
      - name: Upload SDK-backed candidate for private device review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rpc-v5-native-review-candidate
          path: dist/rpc-v5-native-candidate/
          if-no-files-found: error
          retention-days: 7
# Intentionally does not publish a release; ensure licensed SDK distribution
# rights, Android real-device login/RPC/image tests, and release signing first.
