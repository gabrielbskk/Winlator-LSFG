name: Android debug build (SDK-free)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, experimental/rpc-android-v4]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Aurora resource regressions
        run: python3 scripts/test_aurora_resources.py
      - name: Audit packaged GPU drivers (read-only)
        run: |
          python3 scripts/test_driver_inventory.py
          python3 scripts/audit_graphics_drivers.py > /tmp/aurora-driver-inventory.json
          python3 -m json.tool /tmp/aurora-driver-inventory.json > /dev/null
          python3 - <<'PY'
          import json
          with open("/tmp/aurora-driver-inventory.json", encoding="utf-8") as handle:
              result = json.load(handle)
          assert result["declared_drivers"].get("TURNIP") == "turnip"
          assert any(item["path"].endswith("turnip-26.1.0.tzst") for item in result["packaged"])
          print("Packaged:", len(result["packaged"]), "Installable Turnip:", len(result["installable_turnip"]))
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            app/gradle/wrapper/gradle-wrapper.properties
            app/**/*.gradle
      - name: Android SDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: JVM tests and Android debug APK (without Discord SDK)
        working-directory: app
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Upload debug APK for CI inspection
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-sdk-free
          path: app/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-test-reports
          path: |
            app/app/build/test-results/
            app/app/build/reports/tests/
          if-no-files-found: ignore

# IMPORTANT: This workflow intentionally does not download or bundle the
# proprietary Discord Social SDK AAR. An SDK-free APK cannot provide RPC.
# CI is not a substitute for graphics, LSFG, or Discord testing on hardware.
