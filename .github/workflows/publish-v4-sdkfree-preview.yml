name: Publish experimental 4 SDK-free preview

on:
  push:
    branches: [experimental/rpc-android-v4]
    paths: ['.github/workflows/publish-v4-sdkfree-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpc-v4-sdkfree-preview-release
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -type f -name sdkmanager | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;24.0.8215888' 'cmake;3.22.1'
      - name: Verify the SDK-free variant is explicit
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionName "11.2-rpc-experimental.4"' app/app/build.gradle
          grep -q 'versionCode 36' app/app/build.gradle
          test ! -f app/app/libs/discord_partner_sdk.aar
          ! grep -q arm64OnlyGameAssets app/app/build.gradle
      - name: Build full Windows-assets Android ARM64 preview and run JVM tests
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Check APK payload and compute checksum
        shell: bash
        run: |
          set -euo pipefail
          SRC="app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$SRC"
          if unzip -Z1 "$SRC" | grep -Eq '^lib/arm64-v8a/(libwinlator_discord|libdiscord_partner_sdk)\.so$'; then
            echo "Unexpected Discord native SDK in public SDK-free preview" >&2
            exit 1
          fi
          unzip -Z1 "$SRC" | grep -Fx 'assets/rootfs.tzst'
          unzip -Z1 "$SRC" | grep -Fx 'assets/wincomponents/direct3d.tzst'
          mkdir -p dist/experimental-4-preview
          NAME="Winlator-LSFG-Aurora-11.2-experimental.4-SDK-FREE-arm64.apk"
          cp "$SRC" "dist/experimental-4-preview/$NAME"
          (cd dist/experimental-4-preview && sha256sum "$NAME" > SHA256SUMS.txt)
      - name: Publish clearly labeled prerelease with APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: rpc-android-experimental-4-sdkfree-preview
        run: |
          set -euo pipefail
          cat > /tmp/release-notes.md <<'NOTES'
          # Winlator LSFG Aurora 11.2 — Experimental 4 (SDK-FREE preview)

          **AVISO: Este APK NÃO INCLUI o Discord Social SDK e NÃO tem Discord Rich Presence funcional.**
          É apenas uma prévia instalável do código experimental 4 para testar interface, criação de contêiner, jogos Windows 32/64 bits e estabilidade.

          - Android ARM64 / arm64-v8a com arquivos Windows i386-windows e syswow64 preservados no empacotamento.
          - Identidade Aurora, créditos à Rafaela (@amyroseee) e ao Winlator original.
          - Código de melhorias do RPC incluído nos fontes, mas recurso RPC indisponível neste APK sem a biblioteca oficial.
          - Build debug automatizado; testes JVM executados no CI.
          - Não foi validado em dispositivos reais. Faça backup antes de instalar; a assinatura debug pode não substituir a instalação anterior.
          - O APK não distribui Lossless.dll; esse arquivo é fornecido separadamente pelo usuário.

          Uma compilação futura com RPC exige o AAR licenciado oficial e testes físicos. Essa prévia NÃO é anunciada como versão RPC completa.
          Fontes: branch experimental/rpc-android-v4 e PR #7.
          NOTES
          NAME="Winlator-LSFG-Aurora-11.2-experimental.4-SDK-FREE-arm64.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Preview release already exists; leaving its files unchanged"
          else
            gh release create "$TAG" "dist/experimental-4-preview/$NAME"               dist/experimental-4-preview/SHA256SUMS.txt               --repo "$GITHUB_REPOSITORY"               --target "$GITHUB_SHA"               --prerelease               --title "Winlator LSFG Aurora Experimental 4 — SDK-free preview (RPC unavailable)"               --notes-file /tmp/release-notes.md
          fi
      - name: Store APK as short-lived CI artifact too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experimental-4-sdk-free-preview
          path: dist/experimental-4-preview/
          if-no-files-found: ignore
          retention-days: 7
