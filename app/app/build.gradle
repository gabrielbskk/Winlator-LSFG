apply plugin: 'com.android.application'

// Obtain this AAR from the Discord Developer Portal (Social SDK 1.10+).
// Keep proprietary SDK distributions outside version control.
def discordSdkAar = file(providers.gradleProperty('discordSdkAar').getOrElse('libs/discord_partner_sdk.aar'))
def discordSdkEnabled = discordSdkAar.isFile()
def arm64OnlyGameAssets = providers.gradleProperty('arm64OnlyGameAssets').map { it.toBoolean() }.getOrElse(false)
if (providers.gradleProperty('discordSdkAar').isPresent() && !discordSdkEnabled) {
    throw new GradleException("Discord SDK AAR does not exist: ${discordSdkAar}")
}

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 35
        versionName "11.2-rpc-experimental.3"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        testProguardFiles 'proguard-test-rules.pro'
        buildConfigField 'boolean', 'DISCORD_SDK_ENABLED', discordSdkEnabled.toString()
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DWINLATOR_DISCORD_RPC=${discordSdkEnabled ? 'ON' : 'OFF'}"
            }
        }
    }

    buildFeatures {
        buildConfig true
        prefab discordSdkEnabled
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'

            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion providers.gradleProperty('androidNdkVersion').getOrElse(discordSdkEnabled ? '27.2.12479018' : '24.0.8215888')

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }

    if (arm64OnlyGameAssets) {
        sourceSets.main.assets.srcDirs = [layout.buildDirectory.dir('generated/arm64GameAssets').get().asFile]
    }
}

if (arm64OnlyGameAssets) {
    def preparedAssets = layout.buildDirectory.dir('generated/arm64GameAssets')
    def prepareArm64GameAssets = tasks.register('prepareArm64GameAssets', Exec) {
        inputs.dir('src/main/assets')
        inputs.file('../../scripts/prepare_arm64_assets.py')
        outputs.dir(preparedAssets)
        commandLine 'python3', '../../scripts/prepare_arm64_assets.py',
            file('src/main/assets').absolutePath, preparedAssets.get().asFile.absolutePath
    }
    tasks.matching { it.name == 'mergeDebugAssets' }.configureEach {
        dependsOn prepareArm64GameAssets
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'com.google.errorprone:error_prone_annotations:2.18.0'
    if (discordSdkEnabled) {
        implementation files(discordSdkAar)
        implementation 'androidx.browser:browser:1.8.0'
    }
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
